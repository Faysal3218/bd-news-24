<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BD News 24 - Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    .header {
      background: #d71920;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
    }

    .header p {
      margin: 5px 0 0;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 15px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      color: #d71920;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      border: none;
      border-radius: 6px;
      background: #d71920;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #b9151b;
    }

    .logout {
      background: #333;
    }

    .delete {
      background: #555;
    }

    .note {
      background: #fff3cd;
      padding: 12px;
      margin-top: 15px;
      border-radius: 6px;
      font-size: 14px;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    #adminPanel {
      display: none;
    }
